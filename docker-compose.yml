services:
  dj-pro:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: dj-pro:latest
    container_name: dj-pro
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DJ_PASSWORD: ${DJ_PASSWORD:?set DJ_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DATA_DIR: /data
    volumes:
      - dj-data:/data
volumes:
  dj-data:
